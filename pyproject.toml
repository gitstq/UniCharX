[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unicharx"
version = "1.0.0"
description = "🚀 UniCharX - Lightweight Unicode Character Intelligent Search CLI Engine | 轻量级Unicode字符智能搜索CLI引擎"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "UniCharX Team"}
]
keywords = [
    "unicode", "character", "search", "cli", "terminal", "tui",
    "emoji", "symbol", "unicode-search", "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
unicharx = "unicharx.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/UniCharX"
Repository = "https://github.com/gitstq/UniCharX"
Documentation = "https://github.com/gitstq/UniCharX#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["unicharx*"]

[tool.setuptools.package-data]
unicharx = ["data/*.json", "py.typed"]
